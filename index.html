<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }.container {
  background: white;
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  max-width: 420px;
  width: 100%;
  text-align: center;
}

h1 {
  margin-top: 0;
  font-size: 24px;
}

.instructions {
  color: #666;
  font-size: 14px;
}

.palette {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin: 24px 0;
}

.color {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  border: 3px solid transparent;
  cursor: pointer;
  transition: transform 0.2s, border 0.2s;
  margin: auto;
}

.color:hover {
  transform: scale(1.08);
}

.color.active {
  border: 3px solid #222;
}

.result {
  margin-top: 20px;
  padding: 16px;
  border-radius: 14px;
  background: #f7f7f7;
  display: none;
}

.result h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.price {
  font-size: 18px;
  margin: 10px 0;
  color: #333;
}

.total {
  font-size: 30px;
  font-weight: bold;
  color: #1f7a1f;
  margin-top: 18px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
  margin-top: 14px;
  box-sizing: border-box;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Choose Your Color</h1>
    <p class="instructions">Tap a color to see the price.</p><div class="palette" id="palette"></div>

<div class="result" id="result">
  <h2 id="colorName"></h2>
  <div class="price"><strong>1 Litre:</strong> <span id="price1"></span></div>
  <div class="price"><strong>5 Litre:</strong> <span id="price5"></span></div>
  <div class="price"><strong>20 Litre:</strong> <span id="price20"></span></div>

  <input type="number" id="litresInput" min="1" placeholder="Enter litres needed">

  <div class="total" id="totalPrice"></div>

  <button id="sendButton" style="margin-top:16px;padding:12px 18px;border:none;border-radius:12px;background:#25D366;color:white;font-size:16px;cursor:pointer;width:100%;display:none;">
    Send Order on WhatsApp
  </button>
</div>

  </div>
  </div>
  </div>  <script>
    const colors = [
      { name: 'White', hex: '#ffffff', prices: { litre1: 'R120', litre5: 'R550', litre20: 'R2000' } },
      { name: 'Black', hex: '#000000', prices: { litre1: 'R120', litre5: 'R550', litre20: 'R2000' } },
      { name: 'Red', hex: '#e53935', prices: { litre1: 'R140', litre5: 'R650', litre20: 'R2400' } },
      { name: 'Blue', hex: '#1e88e5', prices: { litre1: 'R140', litre5: 'R650', litre20: 'R2400' } },
      { name: 'Green', hex: '#43a047', prices: { litre1: 'R140', litre5: 'R650', litre20: 'R2400' } },
      { name: 'Yellow', hex: '#fdd835', prices: { litre1: 'R150', litre5: 'R700', litre20: 'R2600' } },
      { name: 'Orange', hex: '#fb8c00', prices: { litre1: 'R150', litre5: 'R700', litre20: 'R2600' } },
      { name: 'Grey', hex: '#757575', prices: { litre1: 'R130', litre5: 'R600', litre20: 'R2200' } },
      { name: 'Brown', hex: '#6d4c41', prices: { litre1: 'R130', litre5: 'R600', litre20: 'R2200' } },
      { name: 'Silver', hex: '#c0c0c0', prices: { litre1: 'R160', litre5: 'R750', litre20: 'R2800' } }
    ];

    const palette = document.getElementById('palette');
    const result = document.getElementById('result');
    const colorName = document.getElementById('colorName');
    const price1 = document.getElementById('price1');
    const price5 = document.getElementById('price5');
    const price20 = document.getElementById('price20');
    const litresInput = document.getElementById('litresInput');
    const totalPrice = document.getElementById('totalPrice');
    const sendButton = document.getElementById('sendButton');

    const whatsappNumber = '+27764626566'; // Replace with your WhatsApp number including country code

    let selectedColor = null;

    function updateTotal() {
      if (!selectedColor) return;

      const litres = parseFloat(litresInput.value);
      if (!litres || litres <= 0) {
        totalPrice.textContent = '';
        sendButton.style.display = 'none';
        return;
      }

      const pricePerLitre = parseInt(selectedColor.prices.litre1.replace('R', ''));
      const total = litres * pricePerLitre;

      totalPrice.textContent = `Total Price: R${total}`;
      sendButton.style.display = 'block';

      sendButton.onclick = () => {
        const message = `Hello, I would like to order:%0A%0AColor: ${selectedColor.name}%0ALitres: ${litres}%0ATotal Price: R${total}`;
        window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
      };
    }

      const pricePerLitre = parseInt(selectedColor.prices.litre1.replace('R', ''));
      const total = litres * pricePerLitre;
      totalPrice.textContent = `Total Price: R${total}`;
    }

    litresInput.addEventListener('input', updateTotal);

    colors.forEach(color => {
      const div = document.createElement('div');
      div.className = 'color';
      div.style.background = color.hex;

      if (color.hex === '#ffffff') {
        div.style.border = '1px solid #ccc';
      }

      div.onclick = () => {
        document.querySelectorAll('.color').forEach(c => c.classList.remove('active'));
        div.classList.add('active');

        selectedColor = color;

        colorName.textContent = color.name;
        price1.textContent = color.prices.litre1;
        price5.textContent = color.prices.litre5;
        price20.textContent = color.prices.litre20;
        result.style.display = 'block';

        updateTotal();
      };

      palette.appendChild(div);
    });
  </script></body>
</html>
