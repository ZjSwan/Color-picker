<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Color Picker Cart</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 16px;
  max-width: 450px;
  width: 100%;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}

h1 { margin-top: 0; }

.palette {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin: 15px 0;
}

.color {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  cursor: pointer;
  border: 2px solid transparent;
}

.color.active {
  border: 3px solid #000;
}

.result {
  display: none;
  background: #f7f7f7;
  padding: 12px;
  border-radius: 12px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#addBtn { background: #333; color: white; }
#sendBtn { background: #25D366; color: white; }

.cart {
  margin-top: 10px;
  font-size: 14px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<h1>Choose Color</h1>

<div class="palette" id="palette"></div>

<div class="result" id="result">
  <h3 id="colorName"></h3>

  <input type="number" id="litres" placeholder="Enter litres"/>

  <button id="addBtn">➕ Add to Cart</button>

  <div class="cart" id="cart"></div>

  <h3 id="total"></h3>

  <button id="sendBtn">Send WhatsApp Order</button>
</div>

</div>

<script>
const colors = [
  { name: "White", hex: "#ffffff", prices: [120, 550, 2000] },
  { name: "Black", hex: "#000000", prices: [120, 550, 2000] },
  { name: "Red", hex: "#e53935", prices: [140, 650, 2400] },
  { name: "Blue", hex: "#1e88e5", prices: [140, 650, 2400] },
  { name: "Green", hex: "#43a047", prices: [140, 650, 2400] }
];

let cart = [];
let selectedColor = null;

const palette = document.getElementById("palette");
const result = document.getElementById("result");
const colorName = document.getElementById("colorName");
const litresInput = document.getElementById("litres");
const cartBox = document.getElementById("cart");
const totalBox = document.getElementById("total");

const addBtn = document.getElementById("addBtn");
const sendBtn = document.getElementById("sendBtn");

// ---------- CALC ----------
function calc(litres, color) {
  let [p1, p5, p20] = color.prices;

  let r = litres;

  let b20 = Math.floor(r / 20);
  r -= b20 * 20;

  let b5 = Math.floor(r / 5);
  r -= b5 * 5;

  let b1 = r;

  let total = (b20*p20) + (b5*p5) + (b1*p1);

  return { total, b20, b5, b1 };
}

// ---------- RENDER CART ----------
function renderCart() {
  if (cart.length === 0) {
    cartBox.innerHTML = "<p>Cart empty</p>";
    return;
  }

  cartBox.innerHTML = cart.map((item, i) =>
    `<div class="item">
      ${item.color} (${item.litres}L)
      <span>R${item.total}</span>
      <button onclick="removeItem(${i})">X</button>
    </div>`
  ).join("");
}

window.removeItem = (i) => {
  cart.splice(i, 1);
  renderCart();
};

// ---------- COLORS ----------
colors.forEach(c => {
  const div = document.createElement("div");
  div.className = "color";
  div.style.background = c.hex;

  div.onclick = () => {
    document.querySelectorAll(".color").forEach(x => x.classList.remove("active"));
    div.classList.add("active");

    selectedColor = c;

    colorName.textContent = c.name;
    result.style.display = "block";
  };

  palette.appendChild(div);
});

// ---------- ADD ----------
addBtn.onclick = () => {
  const litres = parseInt(litresInput.value);
  if (!selectedColor || !litres) return;

  const res = calc(litres, selectedColor);

  cart.push({
    color: selectedColor.name,
    litres,
    total: res.total
  });

  litresInput.value = "";
  renderCart();
};

// ---------- SEND ----------
sendBtn.onclick = () => {
  if (cart.length === 0) return;

  let totalAll = 0;

  let msg =
`🧾 NEW ORDER\n\n` +
cart.map(i => {
  totalAll += i.total;
  return `🎨 ${i.color} - ${i.litres}L = R${i.total}`;
}).join("\n") +
`\n\n💰 TOTAL: R${totalAll}`;

  window.open(
    "https://wa.me/27764626566?text=" + encodeURIComponent(msg),
    "_blank"
  );
};
</script>

</body>
</html>
